<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDC3b | Posterior Comparison Explorer</title>
<!-- Plotly.js for scientific graphing -->
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<!-- This assumes posteriors_data.js is generated by your python script -->
<script src="posteriors_data.js"></script>
<!-- Modern typography -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #4361ee;
    --primary-hover: #3a56d4;
    --bg-main: #f8fafc;
    --bg-side: #ffffff;
    --border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --success: #10b981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--bg-main); 
    color: var(--text-main); 
    font-family: 'Inter', system-ui, sans-serif; 
    font-size: 13px;
    height: 100vh;
    overflow: hidden;
  }

  /* HEADER */
  header { 
    height: 60px;
    padding: 0 24px; 
    background: #fff; 
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  header h1 span { color: var(--text-muted); font-size: 13px; margin-left: 8px; font-weight: 400; }

  .layout { display: flex; height: calc(100vh - 60px); }

  /* SIDEBAR */
  aside {
    width: 300px; background: var(--bg-side);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    flex-shrink: 0;
  }

  .aside-section { padding: 20px; border-bottom: 1px solid var(--border); }
  .section-title { 
    font-size: 11px; font-weight: 600; color: var(--text-muted); 
    text-transform: uppercase; letter-spacing: .08em; margin-bottom: 16px;
    display: flex; justify-content: space-between; align-items: center;
  }

  /* Search & Team List */
  .search-container { position: relative; margin-bottom: 12px; }
  .search-box {
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    width: 100%; font-size: 13px; outline: none; transition: border-color 0.2s;
    background: #fdfdfd;
  }
  .search-box:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.08); }

  .team-list { overflow-y: auto; flex: 1; padding: 4px 12px; }
  .team-item {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; cursor: pointer; border-radius: 8px;
    transition: all 0.15s ease; margin-bottom: 2px;
    border: 1px solid transparent;
  }
  .team-item:hover { background: #f1f5f9; }
  .team-item.selected { 
    background: #eef2ff; 
    border-color: rgba(67, 97, 238, 0.1);
    color: var(--primary); 
    font-weight: 500; 
  }
  
  .swatch { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); }
  .team-label { font-size: 13px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Controls */
  .controls { display: flex; flex-direction: column; gap: 16px; }
  .form-group label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px; }
  
  select { 
    width: 100%; border: 1px solid var(--border); border-radius: 8px; 
    padding: 8px 10px; font-size: 13px; background: #fff; cursor: pointer;
    outline: none;
  }
  
  .checkbox-group { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .checkbox-group input { cursor: pointer; width: 16px; height: 16px; accent-color: var(--primary); }

  .btn-group { display: flex; gap: 8px; margin-bottom: 12px; }
  .btn-secondary { 
    flex: 1; background: #f1f5f9; border: 1px solid var(--border); padding: 8px; 
    border-radius: 6px; font-size: 11px; cursor: pointer; color: var(--text-muted);
    font-weight: 500; transition: all 0.2s;
  }
  .btn-secondary:hover { background: var(--border); color: var(--text-main); }

  .plot-btn { 
    background: var(--primary); color: #fff; border: none; border-radius: 8px; 
    padding: 14px; font-size: 14px; font-weight: 600; cursor: pointer; 
    transition: all 0.2s; margin-top: 8px;
    box-shadow: 0 4px 6px -1px rgba(67, 97, 238, 0.2);
  }
  .plot-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
  .plot-btn:active { transform: translateY(0); }
  .plot-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  /* MAIN AREA */
  main { flex: 1; position: relative; background: #fff; display: flex; flex-direction: column; overflow: hidden; }
  #plot { flex: 1; min-height: 0; }

  .empty-state {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; color: var(--text-muted);
    max-width: 300px;
  }
  .empty-state svg { margin-bottom: 20px; opacity: 0.15; color: var(--text-main); }
  .empty-state h3 { color: var(--text-main); margin-bottom: 8px; }

  /* CUSTOM SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    aside { width: 240px; }
  }
</style>
</head>
<body>

<header>
  <h1>SDC3b <span>Posterior Explorer</span></h1>
  <div id="data-status" style="display:flex; align-items:center; gap:6px;">
    <span style="width:8px; height:8px; background:var(--success); border-radius:50%"></span>
    <span style="font-size:11px; font-weight:600; color:var(--text-muted)">POSTERIORS READY</span>
  </div>
</header>

<div class="layout">
  <aside>
    <!-- GLOBAL CONFIG -->
    <div class="aside-section">
      <div class="section-title">Configuration</div>
      <div class="controls">
        <div class="form-group">
          <label>Inference Target (PS Bin)</label>
          <select id="ps-sel"></select>
        </div>
        <div class="form-group">
          <label>Contour Levels</label>
          <div style="display: flex; gap: 10px; margin-top: 4px;">
            <label class="checkbox-group" style="font-size: 11px;">
              <input type="checkbox" id="sigma-1" checked> 1σ
            </label>
            <label class="checkbox-group" style="font-size: 11px;">
              <input type="checkbox" id="sigma-2" checked> 2σ
            </label>
            <label class="checkbox-group" style="font-size: 11px;">
              <input type="checkbox" id="sigma-3"> 3σ
            </label>
          </div>
        </div>
        <label class="checkbox-group">
          <input type="checkbox" id="truth-chk" checked>
          <span>Show Ground Truth</span>
        </label>
      </div>
    </div>

    <!-- TEAM SELECTION -->
    <div class="aside-section" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 10px;">
      <div class="section-title">
        Team Selection
        <span id="badge" style="background: var(--primary); color:#fff; padding: 2px 8px; border-radius: 12px; font-size: 10px;">0</span>
      </div>
      
      <div class="search-container">
        <input type="text" class="search-box" id="team-search" placeholder="Search teams...">
      </div>
      
      <div class="btn-group">
        <button class="btn-secondary" onclick="setAll(true)">All</button>
        <button class="btn-secondary" onclick="setAll(false)">None</button>
      </div>

      <div class="team-list" id="team-list">
        <!-- populated by js -->
      </div>
    </div>

    <!-- ACTION AREA -->
    <div class="aside-section">
      <button class="plot-btn" id="plot-btn" onclick="render()" style="width: 100%;" disabled>Update Corner Plot</button>
    </div>
  </aside>

  <main>
    <div id="plot"></div>
    <div id="empty-msg" class="empty-state">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="9" y1="21" x2="9" y2="9"/>
      </svg>
      <h3>No Teams Selected</h3>
      <p>Select teams from the sidebar and click update to generate the corner plot visualization.</p>
    </div>
  </main>
</div>

<script>
/**
 * UI State & Data Binding
 */
// 30-colour palette: matplotlib tab20 (indices 0-19) + tab20b (indices 0-9)
// Matches the fallback_cycle defined in GridCornerPlotter in the notebook.
const PALETTE = [
  '#1f77b4','#aec7e8','#ff7f0e','#ffbb78','#2ca02c',
  '#98df8a','#d62728','#ff9896','#9467bd','#c5b0d5',
  '#8c564b','#c49c94','#e377c2','#f7b6d2','#7f7f7f',
  '#c7c7c7','#bcbd22','#dbdb8d','#17becf','#9edae5',
  '#393b79','#5254a3','#6b6ecf','#9c9ede','#637939',
  '#8ca252','#b5cf6b','#cedb9c','#8c6d31','#bd9e39',
];

let selectedTeams = new Set();

// Initialize application
if (typeof POSTERIORS_DATA === 'undefined') {
    document.getElementById('plot').innerHTML = `
      <div style="padding: 100px; text-align: center;">
        <h2 style="color:#ef4444">Data Source Error</h2>
        <p style="color:var(--text-muted); margin-top:10px;">
          <code>posteriors_data.js</code> was not found. Please run your Python processing script.
        </p>
      </div>`;
    document.getElementById('empty-msg').style.display = 'none';
    document.getElementById('data-status').style.opacity = '0.3';
} else {
    initApp();
}

function initApp() {
  const db = POSTERIORS_DATA;
  const psSel = document.getElementById('ps-sel');
  
  // Setup PS Select
  db.ps_list.forEach(ps => {
    const opt = document.createElement('option');
    opt.value = opt.textContent = ps;
    psSel.appendChild(opt);
  });

  // Build Team List
  renderTeamList(db.teams);

  // Search filter implementation
  document.getElementById('team-search').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const items = document.querySelectorAll('.team-item');
    items.forEach(item => {
      const isVisible = item.dataset.name.toLowerCase().includes(term);
      item.style.display = isVisible ? 'flex' : 'none';
    });
  });
}

function renderTeamList(teams) {
  const list = document.getElementById('team-list');
  list.innerHTML = '';
  
  teams.forEach((team, i) => {
    const color = PALETTE[i % PALETTE.length];
    const item = document.createElement('div');
    item.className = `team-item ${selectedTeams.has(team) ? 'selected' : ''}`;
    item.dataset.name = team;
    item.innerHTML = `
      <input type="checkbox" id="chk-${i}" ${selectedTeams.has(team) ? 'checked' : ''}>
      <span class="swatch" style="background:${color}"></span>
      <label class="team-label" for="chk-${i}">${team.replace('_', ' ')}</label>
    `;
    
    const checkbox = item.querySelector('input');
    checkbox.addEventListener('change', (e) => handleToggle(team, e.target.checked, item));
    
    // Make whole row clickable
    item.addEventListener('click', (e) => {
      if (e.target !== checkbox && e.target.tagName !== 'LABEL') {
        checkbox.checked = !checkbox.checked;
        handleToggle(team, checkbox.checked, item);
      }
    });
    
    list.appendChild(item);
  });
}

function handleToggle(team, isChecked, element) {
  if (isChecked) {
    selectedTeams.add(team);
    element.classList.add('selected');
  } else {
    selectedTeams.delete(team);
    element.classList.remove('selected');
  }
  
  const count = selectedTeams.size;
  document.getElementById('badge').textContent = count;
  document.getElementById('plot-btn').disabled = count === 0;
}

function setAll(on) {
  const teamItems = document.querySelectorAll('.team-item');
  teamItems.forEach(item => {
    if (item.style.display !== 'none') {
      const cb = item.querySelector('input');
      cb.checked = on;
      handleToggle(item.dataset.name, on, item);
    }
  });
}

/**
 * Math Utilities for Contours
 */
// Convert flat row-major 2D marginal to a Plotly z matrix where each
// cell's value = cumulative probability fraction above that density level.
// Contour lines at p=0.68, 0.95, 0.997 then correspond to proper
// 1σ/2σ/3σ credible regions — matching what getdist/corner draw.
function toCumulativeZ(flat, n) {
  // Build descending sort to compute cumulative from top
  const sorted = [...flat].sort((a, b) => b - a);
  const total  = sorted.reduce((s, v) => s + v, 0);

  // For each unique value, record the cumulative fraction at its LAST occurrence
  let cum = 0;
  const cumByValue = new Map();
  for (const v of sorted) {
    cum += v;
    cumByValue.set(v, cum / total);
  }

  // Build Plotly z[col][r] = cumulative fraction (toZMatrix transpose convention)
  const z = [];
  for (let col = 0; col < n; col++) {
    const row = [];
    for (let r = 0; r < n; r++) {
      const v = flat[r * n + col];
      row.push(cumByValue.get(v) ?? 1.0);
    }
    z.push(row);
  }
  return z;
}


function render() {
  const db = POSTERIORS_DATA;
  if (!db || selectedTeams.size === 0) return;

  // Hide empty state
  document.getElementById('empty-msg').style.display = 'none';

  const ps = document.getElementById('ps-sel').value;
  const showTruth = document.getElementById('truth-chk').checked;
  const coords = db.coords;
  const N = coords.length;
  const truths = db.true_values[ps] || null;
  
  // Sigma level definitions: [value, dash_style, width]
  const sigmaSettings = [];
  if (document.getElementById('sigma-1').checked) sigmaSettings.push({p: 0.6827, dash: 'solid', w: 1.8});
  if (document.getElementById('sigma-2').checked) sigmaSettings.push({p: 0.9545, dash: 'dash', w: 1.2});
  if (document.getElementById('sigma-3').checked) sigmaSettings.push({p: 0.9973, dash: 'dot', w: 0.8});
  
  const traces = [];

  // 1. Process Team Posteriors
  db.teams.filter(t => selectedTeams.has(t)).forEach((team) => {
    const idx = db.teams.indexOf(team);
    const color = PALETTE[idx % PALETTE.length];
    const teamData = db.data[ps][team];
    if (!teamData) return;
    
    const displayName = team.replace('_', ' ');

    // 1D Diagonal Panels (A, C, F)
    [[0,'x','y'], [1,'x3','y3'], [2,'x6','y6']].forEach(([pIdx, xa, ya], i) => {
      const raw = teamData.marg1d[pIdx];
      const normFactor = Math.max(...raw);
      traces.push({
        x: coords, 
        y: raw.map(v => v / (normFactor || 1)),
        xaxis: xa, yaxis: ya,
        type: 'scatter', mode: 'lines',
        line: { color, width: 2.5, shape: 'spline', smoothing: 1.3 },
        fill: 'tozeroy', fillcolor: color + '12', 
        name: displayName, 
        legendgroup: team, 
        showlegend: i === 0,
      });
    });

    // 2D Contour Panels (B, D, E)
    [['0_1','x2','y2'], ['0_2','x4','y4'], ['1_2','x5','y5']].forEach(([key, xa, ya]) => {
      // Convert to cumulative probability z matrix (value = prob mass above this density)
      // Contour at p draws the credible region enclosing fraction p of total probability
      const cumZ = toCumulativeZ(teamData.marg2d[key], N);

      // One trace per sigma level with start/end/size pinned to that level
      sigmaSettings.forEach((setting) => {
        const eps = 0.001;
        traces.push({
          x: coords, y: coords, z: cumZ,
          xaxis: xa, yaxis: ya,
          type: 'contour',
          autocontour: false,
          contours: {
            coloring: 'none',
            showlines: true,
            start: setting.p - eps,
            end:   setting.p + eps,
            size:  2 * eps,
          },
          line: { color, width: setting.w, dash: setting.dash },
          showlegend: false,
          hoverinfo: 'skip',
          name: `${displayName} (${Math.round(setting.p*100)}%)`
        });
      });
    });
  });

  // 2. Add Ground Truth
  if (showTruth && truths) {
    const truthColor = '#000000';
    
    // Diagonal truth markers
    [[truths[0],'x','y'], [truths[1],'x3','y3'], [truths[2],'x6','y6']].forEach(([val, xa, ya], i) => {
      traces.push({
        x: [val, val], y: [0, 1.05], xaxis: xa, yaxis: ya,
        type: 'scatter', mode: 'lines', 
        line: { color: truthColor, width: 1.5, dash: 'dash' },
        name: 'Truth', legendgroup: '__truth', showlegend: i === 0,
        hoverinfo: 'skip'
      });
    });

    // Crosshairs for 2D plots
    [[truths[0], truths[1], 'x2', 'y2'], [truths[0], truths[2], 'x4', 'y4'], [truths[1], truths[2], 'x5', 'y5']]
      .forEach(([tx, ty, xa, ya]) => {
        traces.push(
          {
            x: [tx, tx], y: [0, 1], xaxis: xa, yaxis: ya,
            type: 'scatter', mode: 'lines', line: { color: truthColor, width: 1, dash: 'dot', opacity: 0.5 },
            showlegend: false, legendgroup: '__truth', hoverinfo: 'skip'
          },
          {
            x: [0, 1], y: [ty, ty], xaxis: xa, yaxis: ya,
            type: 'scatter', mode: 'lines', line: { color: truthColor, width: 1, dash: 'dot', opacity: 0.5 },
            showlegend: false, legendgroup: '__truth', hoverinfo: 'skip'
          }
        );
      });
  }

  // 3. Layout Configuration
  const left = 0.12, gap = 0.04;
  const cell = (1 - left - (gap * 2)) / 3;
  const xd = c => [left + c * (cell + gap), left + c * (cell + gap) + cell];
  const yd = r => [1 - (r + 1) * (cell + gap) + gap, 1 - r * (cell + gap)];

  const axisStyle = {
    showgrid: true, gridcolor: '#f1f5f9', zeroline: false,
    showline: true, linecolor: '#cbd5e1', linewidth: 1,
    ticks: 'outside', tickcolor: '#cbd5e1', tickfont: { size: 10, color: '#64748b' },
    nticks: 4, range: [0, 1], fixedrange: true
  };

  const layout = {
    paper_bgcolor: '#fff', plot_bgcolor: '#fff',
    font: { family: 'Inter, sans-serif', color: '#1e293b', size: 12 },
    showlegend: true,
    legend: { 
      orientation: 'h', 
      y: 1.08, x: 0.5, 
      xanchor: 'center',
      bgcolor: 'rgba(255,255,255,0.8)'
    },
    margin: { t: 80, r: 40, b: 60, l: 40 },
    
    // Panel A (0,0)
    xaxis:  { ...axisStyle, domain: xd(0), showticklabels: false },
    yaxis:  { ...axisStyle, domain: yd(0), showticklabels: false },
    
    // Panel B (1,0)
    xaxis2: { ...axisStyle, domain: xd(0), showticklabels: false },
    yaxis2: { ...axisStyle, domain: yd(1), title: 'x<sub>HI,2</sub>' },
    
    // Panel C (1,1)
    xaxis3: { ...axisStyle, domain: xd(1), showticklabels: false },
    yaxis3: { ...axisStyle, domain: yd(1), showticklabels: false },
    
    // Panel D (2,0)
    xaxis4: { ...axisStyle, domain: xd(0), title: 'x<sub>HI,1</sub>' },
    yaxis4: { ...axisStyle, domain: yd(2), title: 'x<sub>HI,3</sub>' },
    
    // Panel E (2,1)
    xaxis5: { ...axisStyle, domain: xd(1), title: 'x<sub>HI,2</sub>' },
    yaxis5: { ...axisStyle, domain: yd(2), showticklabels: false },
    
    // Panel F (2,2)
    xaxis6: { ...axisStyle, domain: xd(2), title: 'x<sub>HI,3</sub>' },
    yaxis6: { ...axisStyle, domain: yd(2), showticklabels: false },
  };

  Plotly.newPlot('plot', traces, layout, {
    responsive: true,
    displaylogo: false,
    modeBarButtonsToRemove: ['select2d', 'lasso2d', 'zoom2d', 'pan2d', 'resetScale2d']
  });
}
</script>
</body>
</html>
